{% extends "records/base.html" %}

{% block title %}删除每日数字记录 - 数据记录系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2>确认删除</h2>
                </div>
                <div class="card-body">
                    <p>确定要删除以下每日数字记录吗？</p>
                    
                    <ul>
                        <li><strong>日期：</strong>{{ object.date }}</li>
                        <li><strong>命中数字：</strong>{{ object.hit_number }}</li>
                        <li><strong>命中时间：</strong>{{ object.hit_time|time:"H:i" }}</li>
                        <li><strong>开出数字：</strong>{{ object.opened_number }}</li>
                    </ul>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'daily_number_list' %}" class="btn btn-secondary">取消</a>
                            <button type="submit" class="btn btn-danger">确认删除</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
