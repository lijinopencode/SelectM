{% extends "records/base.html" %}

{% block title %}删除类别 - 数据记录系统{% endblock %}

{% block content %}
    <h2>确认删除</h2>
    <p>您确定要删除类别「{{ object.name }}」吗？该操作会同时删除其下所有数据记录！</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">确认删除</button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary">取消</a>
    </form>
{% endblock %}
